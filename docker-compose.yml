services:
  minecraft:
    build: .
    image: custom-minecraft:latest
    container_name: minecraft
    restart: unless-stopped
    stdin_open: true          # lets you use the server console: docker attach minecraft
    tty: true
    stop_grace_period: 2m     # time to save the world on shutdown
    ports:
      - "${HOST_PORT:-25565}:25565"
    environment:
      EULA: "${EULA:-false}"
      MC_VERSION: "${MC_VERSION:-latest}"
      LOADER: "${LOADER:-vanilla}"            # vanilla | fabric | forge | neoforge
      LOADER_VERSION: "${LOADER_VERSION:-}"   # empty = recommended/latest stable
      MEMORY: "${MEMORY:-4G}"
      MEMORY_MIN: "${MEMORY_MIN:-}"
      JVM_OPTS: "${JVM_OPTS:-}"
      UPDATE: "${UPDATE:-false}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./data:/data          # world, server.properties, logs, installed server files
      - ./mods:/data/mods     # drop mod .jar files here
      - ./config:/data/config # mod configs
