# Uses the prebuilt image from GitHub (built automatically on every push to main).
# To build locally instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  minecraft:
    image: ${IMAGE:-ghcr.io/merpzz/minecraft-docker:latest}
    container_name: minecraft
    restart: unless-stopped
    stdin_open: true          # lets you use the server console: docker attach minecraft
    tty: true
    stop_grace_period: 2m     # time to save the world on shutdown
    ports:
      - "${SERVER_PORT:-25565}:${SERVER_PORT:-25565}"
    environment:
      EULA: "${EULA:-false}"
      MC_VERSION: "${MC_VERSION:-latest}"
      LOADER: "${LOADER:-vanilla}"            # vanilla | fabric | forge | neoforge
      LOADER_VERSION: "${LOADER_VERSION:-}"   # empty = recommended/latest stable
      SERVER_PORT: "${SERVER_PORT:-25565}"
      OPS: "${OPS:-}"                         # operators, comma separated
      OP_LEVEL: "${OP_LEVEL:-4}"
      PERSIST: "${PERSIST:-}"                 # paths kept in ./persist (or PERSIST_HOST_DIR)
      MEMORY: "${MEMORY:-4G}"
      MEMORY_MIN: "${MEMORY_MIN:-}"
      JVM_OPTS: "${JVM_OPTS:-}"
      UPDATE: "${UPDATE:-false}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./data:/data          # world, server.properties, logs, installed server files
      - ./mods:/data/mods     # drop mod .jar files here
      - ./config:/data/config # mod configs
      - ${PERSIST_HOST_DIR:-./persist}:/persist   # survives reinstall, see PERSIST in .env
